# The schema key drives editor completions.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$directory$git_branch\
$git_status\
$docker_context\
$nodejs\
$python\
$rust\
$golang\
$dotnet\
$aws\
$cmd_duration\
$battery\
$line_break\
$character"""

# The branch is appended here by git_branch, not printed on its own.
[directory]
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
style = "bold blue"
format = "[$path]($style)"
repo_root_format = "[$path]($style)[$repo]($style)"

# git_branch prints ":branch" directly after the directory path.
[git_branch]
disabled = false
format = "[:](bold blue)[$branch](bold green)"

[git_status]
format = " [ ${conflicted}${ahead_behind}${modified}${stashed} ]($style)"
conflicted = "${([≠](bold red))}${( | )}"
ahead = "${([↑${count}](cyan))}${( | )}"
behind = "${([↓${count}](magenta))}${( | )}"
diverged = "${([↕${ahead_count}↓${behind_count}](purple))}${( | )}"
modified = "${([!${count}](yellow))}"
stashed = "${( | )}${([S${count}](dim blue))}"
style = "bold white"

# cmd_duration prints the exit status next to the duration.
[cmd_duration]
min_time = 2000
format = " [⏱️ ${status}$duration]($style)"
style = "yellow"
show_milliseconds = false

# The status module only supplies $status to cmd_duration.
[status]
disabled = false
format = "$status in "
style = "bold red"
map_symbol = false
pipestatus = false

[nodejs]
format = " [⬢ $version](bold green) "
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts", "jsx", "tsx", "json"]
detect_files = ["package.json", ".node-version"]

[python]
format = " [🐍 $version](bold blue) "
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "setup.py"]

[rust]
format = " [🦀 $version](bold red) "
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[golang]
format = " [🐹 $version](bold cyan) "
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

[dotnet]
format = " [🔵 $version](bold purple) "
detect_extensions = ["cs", "csproj", "fs", "fsproj"]
detect_files = ["global.json", "project.json", ".csproj", ".fsproj"]

[docker_context]
format = " [🐳 $context](blue bold) "
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[aws]
format = " [☁️ $profile]($style) "
style = "bold yellow"

# Empty symbols hide the battery unless it discharges below 20 percent.
[battery]
format = "[$symbol]($style) "
full_symbol = ""
charging_symbol = ""
discharging_symbol = "[🪫](red bold)"
disabled = false
display = [{ threshold = 20 }]

[character]
success_symbol = "[>](green)"
error_symbol = "[>](red)"